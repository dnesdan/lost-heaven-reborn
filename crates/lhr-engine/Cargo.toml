[package]
name = "lhr-engine"
version = "0.1.0"
edition = "2021"
[dependencies]
lhr-assets = { path = "../lhr-assets" }
lhr-render = { path = "../lhr-render" }
wgpu = { version = "=24.0.5", default-features = false, features = ["wgsl", "metal"] }
winit = { version = "=0.30.12", default-features = false, features = ["rwh_06", "x11"] }
pollster = "=0.4.0"
glam = "=0.29.3"
cpal = "=0.15.3"
egui = { version = "=0.31.1", optional = true }
egui-wgpu = { version = "=0.31.1", optional = true }
egui-winit = { version = "=0.31.1", default-features = false, optional = true }

[features]
default = []
engine-lab = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
