[workspace]
members = ["crates/lhr-assets", "crates/lhr-render", "crates/lhr-engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
strip = "debuginfo"
