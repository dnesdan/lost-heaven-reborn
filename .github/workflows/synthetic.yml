name: Synthetic Linux checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LHR_TOOLS_DIR: ${{ runner.temp }}/lhr-tools
      XDG_DATA_HOME: ${{ runner.temp }}/lhr-data
      XDG_CONFIG_HOME: ${{ runner.temp }}/lhr-config
      XDG_CACHE_HOME: ${{ runner.temp }}/lhr-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/lhr-tools/*.zip
            ${{ runner.temp }}/lhr-tools/*.tpz
          key: godot-4.6.3-linux-x86_64-official
      - run: ./scripts/setup.sh
      - run: ./scripts/test.sh
      - run: ./scripts/export.sh Linux
      - name: Verify standalone synthetic package
        shell: bash
        run: |
          set -euo pipefail
          ./build/linux/lost-heaven-reborn.x86_64 --headless --quit-after 30 > "$RUNNER_TEMP/standalone.log" 2>&1
          cat "$RUNNER_TEMP/standalone.log"
          if rg -n 'SCRIPT ERROR|ERROR:|Parse Error|Failed to load' "$RUNNER_TEMP/standalone.log"; then
            exit 1
          fi
